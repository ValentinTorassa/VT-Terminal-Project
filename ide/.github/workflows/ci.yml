name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # zed/*.json are JSONC (comments, trailing commas): parsed the way Zed reads
  # them, failing on syntax errors and on duplicate keys.
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: JSONC parses, no duplicate keys
        run: python3 .github/scripts/check_jsonc.py --self-test

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck --version
      - name: shellcheck (warning and above)
        run: shellcheck -S warning install.sh scripts/vt-*
