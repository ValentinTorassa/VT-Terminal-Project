name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  shellcheck:
    # Pinned: ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19; change the image on purpose.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck --version
      - run: >-
          shellcheck
          install.sh install-linux.sh install-macos.sh bootstrap.sh
          scripts/symlink.sh scripts/uninstall.sh
          scripts/claude-resume scripts/vt-term scripts/vt
          git/hooks/commit-msg git/hooks/pre-commit git/hooks/pre-push git/hooks/passthrough
          tests/vt-test.sh tests/git-guard-test.sh
      # ide/ came from VT-IDE-Project, which gated on warnings and above.
      - name: shellcheck ide/ (warning and above)
        run: shellcheck -S warning ide/install.sh ide/scripts/vt-*
  # ide/zed/*.json are JSONC (comments, trailing commas): parsed the way Zed
  # reads them, failing on syntax errors and on duplicate keys.
  zed-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: JSONC parses, no duplicate keys
        run: python3 .github/scripts/check_jsonc.py --self-test
  vt-tests:
    # macOS runs /bin/bash 3.2, the version vt has to keep working on.
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: /bin/bash --version
      - run: /bin/bash tests/vt-test.sh
      - run: /bin/sh tests/git-guard-test.sh
  # The one-line install, without installing: it clones this repository and checks out the pushed
  # commit. Only on push: a pull request's commit is not in the public clone yet.
  bootstrap:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bootstrap.sh clones and checks out the requested commit
        run: |
          VT_TERMINAL_DIR="$RUNNER_TEMP/dots" VT_TERMINAL_REF="$GITHUB_SHA" VT_TERMINAL_NO_INSTALL=1 bash bootstrap.sh
          test "$(git -C "$RUNNER_TEMP/dots" rev-parse HEAD)" = "$GITHUB_SHA"
          # a second run updates the same clone instead of failing
          VT_TERMINAL_DIR="$RUNNER_TEMP/dots" VT_TERMINAL_REF="$GITHUB_SHA" VT_TERMINAL_NO_INSTALL=1 bash bootstrap.sh
